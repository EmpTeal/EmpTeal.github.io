<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EAF0F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Keystones">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Daily keystones</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0F7; --surface:#FFFFFF; --ink:#13203B; --muted:#5A6A84; --line:#D3DCE8;
  --accent:#2447F5; --accent-ink:#FFFFFF; --amber:#E39B0B; --amber-ink:#8A5A00; --amber-on:#3A2500;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1527; --surface:#16213A; --ink:#E7EDF9; --muted:#91A2BF; --line:#273452;
    --accent:#7F95FF; --accent-ink:#0D1527; --amber:#F2B84B; --amber-ink:#F2B84B; --amber-on:#2A1B00;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1527; --surface:#16213A; --ink:#E7EDF9; --muted:#91A2BF; --line:#273452;
  --accent:#7F95FF; --accent-ink:#0D1527; --amber:#F2B84B; --amber-ink:#F2B84B; --amber-on:#2A1B00;
}
html{scroll-padding-top:env(safe-area-inset-top, 0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding:18px 16px 40px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.day{font-family:var(--display);font-weight:700;font-size:clamp(40px,12vw,56px);line-height:.95;letter-spacing:-.02em;margin:0}
.date{color:var(--muted);font-size:15px;margin-top:6px}
.nav{display:flex;gap:6px}
.nav button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.nav button:disabled{opacity:.35;cursor:default}
.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.back{margin-top:10px;border:0;background:none;color:var(--accent);padding:8px 0;font-weight:600}

/* keystone bar */
.meter{margin-top:20px}
.segs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg{height:16px;border-radius:8px;background:var(--line);transition:background .25s}
.seg.s1{background:var(--accent)}
.seg.s2{background:var(--amber)}
.seglabels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;font-size:13px;color:var(--muted)}
.status{margin-top:14px;font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.01em}
.status.win{color:var(--accent)}
.substatus{color:var(--muted);font-size:14px;margin-top:2px}
.banner{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--amber);color:var(--ink);font-size:14px}
.banner b{font-weight:600}

/* windows */
details.win{margin-top:14px;font-size:14px;color:var(--muted)}
details.win summary{cursor:pointer;padding:6px 0;list-style:none}
details.win summary::-webkit-details-marker{display:none}
details.win summary u{color:var(--accent);text-decoration:none;font-weight:600;white-space:nowrap}
.winform{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);gap:8px 10px;align-items:center;margin-top:6px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.winform label{color:var(--ink)}
.winform input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0;width:100%}

/* streak */
.streak{margin-top:20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.streak .n{font-family:var(--display);font-weight:700;font-size:28px;line-height:1}
.streak .l{color:var(--muted);font-size:13px}
.strip{display:flex;gap:3px;flex-wrap:nowrap}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:transparent;padding:0;flex:none}
.dot.win{background:var(--accent);border-color:var(--accent)}
.dot.part{border-color:var(--amber);background:linear-gradient(to top,var(--amber) 50%,transparent 50%)}
.dot.sel{outline:2px solid var(--ink);outline-offset:2px}

/* groups */
h2{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:-.01em;margin:28px 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 10px}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:10px 12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.row.key{border-radius:16px;border-left:5px solid var(--accent);padding-left:10px}
.tick{width:44px;height:44px;border-radius:50%;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0;transition:background .15s,border-color .15s,transform .1s}
.row.key .tick{border-color:var(--accent)}
.tick:active{transform:scale(.92)}
.tick svg{width:22px;height:22px;stroke:var(--accent-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .15s}
.tick.full{background:var(--accent);border-color:var(--accent)}
.tick.full svg{opacity:1}
.tick.floor{border-color:var(--amber);background:linear-gradient(to top,var(--amber) 50%,transparent 50%)}
.t{font-weight:600;font-size:16px}
.when{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:11px;font-size:12.5px;font-weight:600;color:var(--accent);border:1.5px solid var(--accent);vertical-align:1px;white-space:nowrap}
.d{color:var(--muted);font-size:14px}
.f{color:var(--amber-ink);font-size:13px;margin-top:2px}
.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.pips i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);display:block}
.pips i.on{background:var(--accent);border-color:var(--accent)}
.fbtn{height:32px;padding:0 12px;border-radius:16px;border:1.5px solid var(--amber);background:transparent;color:var(--amber-ink);font-size:13px;font-weight:600;align-self:center}
.fbtn[aria-pressed="true"]{background:var(--amber);color:var(--amber-on)}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* illustration tiles */
.ico{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px}
.tile{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:54px;padding:6px 5px 4px;border-radius:10px;background:#F2F5FA;border:1px solid #E1E8F2}
.tile svg{width:40px;height:40px;display:block}
.tile span{font-size:10.5px;line-height:1.2;color:#5A6A84;text-align:center;white-space:nowrap}

/* backup */
details.backup{margin-top:14px;font-size:14px;color:var(--muted)}
details.backup summary{cursor:pointer;padding:6px 0;list-style:none}
details.backup summary::-webkit-details-marker{display:none}
details.backup summary u{color:var(--accent);text-decoration:none;font-weight:600}
.bform{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;align-items:center;margin-top:6px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.bform p{grid-column:1 / -1;margin:0 0 4px;font-size:13px;line-height:1.45}
.bform a{color:var(--accent)}
.bform label{color:var(--ink)}
.bform input[type=text],.bform input[type=password]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0;width:100%}
.brow{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.brow button,.brow .filebtn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font-weight:600;font-size:14px;color:var(--ink);cursor:pointer}
.brow button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* footer */
.foot{margin-top:28px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}
.foot button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* printable sheet */
.sheet{display:none}
@media print{
  :root{padding:0!important}
  html,body{background:#fff!important;color:#000!important}
  .app{display:none!important}
  .sheet{display:block;font-family:var(--body);color:#000}
  @page{margin:.5in}
}
.sheet h1{font-family:var(--display);font-size:26px;margin:0 0 2px}
.sheet p{margin:0 0 10px;font-size:12px;color:#333}
.sheet table{width:100%;border-collapse:collapse;table-layout:fixed}
.sheet th{font-size:11px;font-weight:600;text-align:center;padding:2px 0}
.sheet th small{display:block;font-weight:400;color:#555}
.sheet td{border-top:1px solid #999;padding:5px 2px;text-align:center;vertical-align:middle}
.sheet td.lab{text-align:left;width:38%;padding-right:8px}
.sheet td.lab b{display:block;font-size:12.5px}
.sheet td.lab span{display:block;font-size:10px;color:#444;line-height:1.25}
.sheet td i{display:inline-block;width:20px;height:20px;border:1.6px solid #000;border-radius:4px}
.sheet tr.k td.lab b{font-size:14px}
.sheet tr.k td i{width:24px;height:24px;border-width:2.2px}
.sheet tr.grp td{border-top:2px solid #000;text-align:left;font-weight:600;font-size:12px;padding-top:8px;background:#f1f1f1}
.sheet tr.win td i{border-radius:50%}
.sheet .rules{margin-top:12px;font-size:11px;color:#222}
</style>
</head>

/* ---------- habits ---------- */
var KEYS=[
 {id:'wake',when:'wake',t:'Wake in your window',d:'Out of bed, coffee, a few minutes of sunlight.',f:'Floor: up within an hour of the window.',
  ico:[['coffee','Coffee'],['sun','Sunlight']]},
 {id:'work',t:'Work start',d:'One hour of real work.',f:'Floor: 15 minutes, then you may stop.',
  ico:[['computer','Work']]},
 {id:'bed',when:'bed',t:'In bed',d:'Humidifier, air filter, TV timer, decide what to watch, then lights out.',f:'Floor: in bed within an hour, TV decided first.',
  ico:[['humid','Humidifier'],['air','Air filter'],['clock','In bed']]}
];
var BONUS=[
 {id:'morning',t:'Morning cluster',d:'Vitamins, red light 10 min, meditate 20 min.',f:'Floor: vitamins and 2 minutes of meditation.',
  ico:[['vitamins','Vitamins'],['redlight','Red light'],['meditate','Meditate']]},
 {id:'move',t:'Move',d:'20 push-ups and 20 squats.',f:'Floor: 5 and 5.',
  ico:[['pushup','Move']]},
 {id:'meal',t:'One real meal',d:'Meat and veg, your main meal of the day.',f:'Floor: protein plus any vegetable.',
  ico:[['plate','Real meal']]},
 {id:'pm',t:'PM routine',d:'Teeth, floss, face, Hims, nasal gel.',f:'Floor: teeth and Hims.',
  ico:[['brush','Toothbrush'],['floss','Floss'],['wash','Face wash'],['hims','Hims spray'],['ayr','Nasal gel']]}
];
var WEEK=[
 {id:'guitar',t:'Guitar',d:'A practice session.',f:'Floor: 10 minutes.',target:4,
  ico:[['guitar','Guitar']]},
 {id:'creative',t:'Creative project',d:'A real session on a project.',f:'Floor: 15 minutes.',target:5,
  ico:[['comics','Comics'],['game','Games'],['video','Video']]}
];
var LS='keystones-v1', DNAMES=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var appEl=document.getElementById('app'), sheetEl=document.getElementById('sheet');
var docRef=null, saveTimer=null, syncMode='device', winOpen=false, bkOpen=false;
var GHK='keystones-gh', gh=null, ghSha=null, ghTimer=null, ghBusy=false, ghDirty=false, syncText='';

function pad(n){return String(n).padStart(2,'0')}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(k){var p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12)}
function addDays(k,n){var d=parse(k);d.setDate(d.getDate()+n);return keyOf(d)}
// the tracker day rolls over at 4 AM so a late bedtime still counts for the day you lived
function nowKey(){return keyOf(new Date(Date.now()-4*36e5))}
function weekKeys(k){var dow=(parse(k).getDay()+6)%7, m=addDays(k,-dow), a=[];for(var i=0;i<7;i++)a.push(addDays(m,i));return a}
function fmtT(t){
  if(!/^\d\d:\d\d$/.test(t||''))return '';
  var p=t.split(':').map(Number), h=p[0], ap=h>=12?'PM':'AM';
  h=h%12||12; return h+':'+pad(p[1])+' '+ap;
}
function fmtRange(r){
  if(!r)return '';
  var x=fmtT(r[0]),y=fmtT(r[1]); if(!x||!y)return '';
  return (x.slice(-2)===y.slice(-2)?x.slice(0,-3):x)+'\u2013'+y;
}
function fmtLong(k,o){return parse(k).toLocaleDateString(undefined,o)}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}

var today=nowKey(), sel=today;
var state=load();
gh=loadGh();

function fresh(){return {v:1,first:today,updated:0,days:{},settings:{set:false,wake:['09:00','10:00'],bed:['00:00','01:00']}}}
function norm(s){
  var f=fresh(); if(!s||typeof s!=='object')return f;
  f.first=typeof s.first==='string'?s.first:today;
  f.updated=+s.updated||0;
  f.days=(s.days&&typeof s.days==='object')?s.days:{};
  // only keep saved windows if the person actually changed them
  if(s.settings&&s.settings.set){
    f.settings.set=true;
    if(Array.isArray(s.settings.wake))f.settings.wake=s.settings.wake.slice(0,2);
    if(Array.isArray(s.settings.bed))f.settings.bed=s.settings.bed.slice(0,2);
  }
  return f;
}
function load(){
  try{var r=localStorage.getItem(LS);if(r)return norm(JSON.parse(r));}catch(e){}
  return fresh();
}
function persistLocal(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
function save(){
  state.updated=Date.now();
  persistLocal();
  if(docRef){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(function(){
      docRef.set(state).then(function(){setSync('account')}).catch(function(){setSync('device')});
    },500);
  }
  ghSchedule();
}
function statusText(){
  if(gh)return syncText||'GitHub backup is on';
  return syncMode==='account'?'Saved to your account':'Saved on this device only';
}
function bkLabel(){
  if(!gh)return 'Not backed up yet. <u>Set up backup</u>';
  if(/^(Saved to|Loaded from) GitHub$/.test(syncText))return 'Backed up to GitHub. <u>Settings</u>';
  if(/failed/.test(syncText))return 'GitHub backup needs attention. <u>Settings</u>';
  return 'Backing up to GitHub. <u>Settings</u>';
}
function paintStatus(){
  var el=document.getElementById('sync');if(el)el.textContent=statusText();
  var bs=document.getElementById('bksum');if(bs)bs.innerHTML=bkLabel();
}
function setSync(m){syncMode=m;paintStatus();}
function setStatus(t){syncText=t;paintStatus();}

/* ---------- GitHub backup (commits one JSON file to a repo you choose) ---------- */
function loadGh(){
  try{var r=JSON.parse(localStorage.getItem(GHK)||'null');if(r&&r.token&&r.repo)return r}catch(e){}
  return null;
}
function ghUrl(){return 'https://api.github.com/repos/'+gh.repo+'/contents/'+encodeURI(gh.path||'keystones-data.json')}
function ghHeaders(){return {'Authorization':'Bearer '+gh.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}
function b64e(s){var b=new TextEncoder().encode(s),x='';b.forEach(function(c){x+=String.fromCharCode(c)});return btoa(x)}
function b64d(s){var x=atob(s.replace(/\s/g,'')),a=new Uint8Array(x.length);for(var i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return new TextDecoder().decode(a)}
function ghErr(status){
  if(status===401)return 'token rejected';
  if(status===403)return 'token lacks permission (needs Contents: read and write)';
  if(status===404)return 'repo not found (check the name and token access)';
  return 'GitHub error '+status;
}
async function ghPull(){
  var q=gh.branch?'?ref='+encodeURIComponent(gh.branch):'';
  var r=await fetch(ghUrl()+q,{headers:ghHeaders(),cache:'no-store'});
  if(r.status===404){ghSha=null;return null}
  if(!r.ok)throw new Error(ghErr(r.status));
  var j=await r.json(); ghSha=j.sha;
  return JSON.parse(b64d(j.content));
}
async function ghPush(retried){
  var body={message:'Update keystones '+new Date().toISOString().slice(0,16).replace('T',' '),content:b64e(JSON.stringify(state,null,1))};
  if(ghSha)body.sha=ghSha;
  if(gh.branch)body.branch=gh.branch;
  var r=await fetch(ghUrl(),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHeaders()),body:JSON.stringify(body)});
  if((r.status===409||r.status===422)&&!retried){
    var remote=await ghPull();
    if(remote&&norm(remote).updated>state.updated){state=norm(remote);persistLocal();render();return}
    return ghPush(true);
  }
  if(!r.ok)throw new Error(ghErr(r.status));
  var j=await r.json(); ghSha=j.content&&j.content.sha;
}
function ghSchedule(){
  if(!gh)return;
  ghDirty=true; clearTimeout(ghTimer);
  setStatus('Saved on this device, saving to GitHub shortly');
  ghTimer=setTimeout(ghRun,4000);
}
async function ghRun(){
  if(!gh)return;
  if(ghBusy){ghTimer=setTimeout(ghRun,1500);return}
  ghBusy=true; ghDirty=false; setStatus('Saving to GitHub');
  try{await ghPush();setStatus('Saved to GitHub');}
  catch(e){setStatus('GitHub save failed ('+e.message+'). Saved on this device.');}
  ghBusy=false;
  if(ghDirty)ghSchedule();
}
async function ghInit(){
  if(!gh)return;
  ghBusy=true; setStatus('Checking GitHub');
  try{
    var remote=await ghPull();
    var rs=remote?norm(remote):null;
    if(rs&&rs.updated>state.updated){state=rs;persistLocal();render();setStatus('Loaded from GitHub');}
    else if(!rs||rs.updated<state.updated){await ghPush();setStatus('Saved to GitHub');}
    else setStatus('Saved to GitHub');
  }catch(e){setStatus('GitHub sync failed ('+e.message+'). Saved on this device.');}
  ghBusy=false;
  if(ghDirty)ghSchedule();
}

function dayOf(k){return state.days[k]||{}}
function isWin(k){var d=dayOf(k);return KEYS.every(function(h){return d[h.id]})}
function anyChecks(k){return Object.keys(dayOf(k)).length>0}
function weekCount(id,k){return weekKeys(k).filter(function(x){return dayOf(x)[id]}).length}
function streak(){
  var k=today,n=0;
  if(!isWin(k))k=addDays(k,-1);
  while(isWin(k)&&n<1000){n++;k=addDays(k,-1)}
  return n;
}
function toggle(k,id,val){
  var d=state.days[k]||(state.days[k]={});
  if(d[id]===val)delete d[id];else d[id]=val;
  if(!Object.keys(d).length)delete state.days[k];
  save();render();
}

function tiles(h){
  if(!h.ico)return '';
  return '<div class="ico">'+h.ico.map(function(p){
    return '<div class="tile">'+ICONS[p[0]]+'<span>'+p[1]+'</span></div>';
  }).join('')+'</div>';
}
function row(h,k,cls,extra){
  var v=dayOf(k)[h.id]||0;
  var chip=h.when?'<span class="when">'+fmtRange(state.settings[h.when])+'</span>':'';
  return '<div class="row '+cls+'">'+
    '<button class="tick '+(v===1?'full':v===2?'floor':'')+'" data-act="full" data-id="'+h.id+'" aria-pressed="'+(v===1)+'" aria-label="Done in full: '+h.t+'">'+
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>'+
    '<div><div class="t">'+h.t+chip+'</div><div class="d">'+h.d+(extra||'')+'</div><div class="f">'+h.f+'</div></div>'+
    '<button class="fbtn" data-act="floor" data-id="'+h.id+'" aria-pressed="'+(v===2)+'" aria-label="Done at floor level: '+h.t+'">Floor</button>'+
    tiles(h)+
  '</div>';
}
function pips(id,target,k){
  var c=weekCount(id,k),s='<span class="pips" aria-hidden="true">';
  for(var i=0;i<target;i++)s+='<i class="'+(i<c?'on':'')+'"></i>';
  return ' This week '+c+' of '+target+s+'</span>';
}
function windowSummary(){
  return 'Wake '+fmtRange(state.settings.wake)+'. In bed '+fmtRange(state.settings.bed)+'. ';
}

function render(){
  var d=dayOf(sel), isToday=sel===today, i;
  var kv=KEYS.map(function(h){return d[h.id]||0});
  var kn=kv.filter(Boolean).length, win=kn===3;
  var bonus=BONUS.filter(function(h){return d[h.id]}).length;
  var yday=addDays(today,-1);

  var h='<div class="top"><div><h1 class="day">'+fmtLong(sel,{weekday:'long'})+'</h1>'+
    '<div class="date">'+fmtLong(sel,{month:'long',day:'numeric'})+(isToday?', today':'')+'</div></div>'+
    '<div class="nav"><button data-act="prev" aria-label="Previous day"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>'+
    '<button data-act="next" aria-label="Next day"'+(isToday?' disabled':'')+'><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div></div>';
  if(!isToday)h+='<button class="back" data-act="today">Back to today</button>';

  h+='<div class="meter"><div class="segs" role="img" aria-label="'+kn+' of 3 keystones done">'+
    kv.map(function(v){return '<div class="seg s'+v+'"></div>'}).join('')+'</div>'+
    '<div class="seglabels"><span>Wake</span><span>Work</span><span>Bed</span></div>'+
    '<div class="status'+(win?' win':'')+'">'+(win?'This day counts.':kn+' of 3 keystones')+'</div>'+
    '<div class="substatus">'+(win?bonus+' of 4 extras done.':'All three make the day count. Floor versions count too.')+'</div></div>';

  if(isToday&&!win&&state.first<today&&!isWin(yday)){
    h+='<div class="banner"><b>Yesterday missed.</b> Never miss twice. Floor versions count today.</div>';
  }

  h+='<details class="win"'+(winOpen?' open':'')+'><summary><span id="winsum">'+windowSummary()+'</span><u>Change</u></summary>'+
    '<div class="winform">'+
    '<label for="w0">Wake from</label><input id="w0" type="time" value="'+state.settings.wake[0]+'">'+
    '<label for="w1">to</label><input id="w1" type="time" value="'+state.settings.wake[1]+'">'+
    '<label for="b0">In bed from</label><input id="b0" type="time" value="'+state.settings.bed[0]+'">'+
    '<label for="b1">to</label><input id="b1" type="time" value="'+state.settings.bed[1]+'">'+
    '</div></details>';

  var sn=streak(), strip='';
  for(i=13;i>=0;i--){
    var k=addDays(today,-i);
    var c=isWin(k)?'win':anyChecks(k)?'part':'';
    strip+='<button class="dot '+c+(k===sel?' sel':'')+'" data-act="go" data-k="'+k+'" aria-label="'+fmtLong(k,{weekday:'long',month:'short',day:'numeric'})+(c==='win'?', counted':c?', partly done':'')+'"></button>';
  }
  h+='<div class="streak"><div><div class="n">'+sn+'</div><div class="l">day streak</div></div><div class="strip">'+strip+'</div></div>';

  h+='<h2>Keystones</h2><p class="sub">These three decide whether the day counts.</p>';
  KEYS.forEach(function(x){h+=row(x,sel,'key')});

  h+='<h2>Extras</h2><p class="sub">Each routine is one box. The small steps live inside it.</p>';
  BONUS.forEach(function(x){h+=row(x,sel,'')});

  h+='<h2>This week</h2><p class="sub">Weekly targets, so a missed day is not a failure.</p>';
  WEEK.forEach(function(x){h+=row(x,sel,'',pips(x.id,x.target,sel))});

  h+='<div class="foot"><span id="sync">'+statusText()+'</span>'+
     '<button data-act="print">Print this week\'s sheet</button></div>';

  var g=gh||{repo:'',token:'',path:'keystones-data.json',branch:''};
  h+='<details class="backup"'+(bkOpen?' open':'')+'><summary id="bksum">'+bkLabel()+'</summary>'+
    '<div class="bform">'+
    '<p>Saves your progress as one small file in a GitHub repo you own, so clearing your browser cannot erase it. Use a private repo just for data, and a fine-grained token limited to that repo with Contents: read and write. <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Create a token</a></p>'+
    '<label for="g-repo">Data repo</label><input id="g-repo" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="username/keystones-data" value="'+esc(g.repo)+'">'+
    '<label for="g-tok">Token</label><input id="g-tok" type="password" autocomplete="off" placeholder="github_pat_..." value="'+esc(g.token)+'">'+
    '<label for="g-path">File</label><input id="g-path" type="text" autocapitalize="none" spellcheck="false" value="'+esc(g.path||'keystones-data.json')+'">'+
    '<label for="g-br">Branch</label><input id="g-br" type="text" autocapitalize="none" spellcheck="false" placeholder="default branch" value="'+esc(g.branch||'')+'">'+
    '<div class="brow"><button class="primary" data-act="gh-save">Save and sync</button>'+(gh?'<button data-act="gh-off">Disconnect</button>':'')+'</div>'+
    '<div class="brow"><button data-act="export">Export a copy</button><label class="filebtn" for="imp">Import a copy</label><input id="imp" type="file" accept="application/json,.json" hidden></div>'+
    '</div></details>';

  appEl.innerHTML=h;
  var dt=appEl.querySelector('details.win');
  if(dt)dt.addEventListener('toggle',function(){winOpen=dt.open});
  var bk=appEl.querySelector('details.backup');
  if(bk)bk.addEventListener('toggle',function(){bkOpen=bk.open});
  var imp=document.getElementById('imp');
  if(imp)imp.addEventListener('change',function(){
    var f=imp.files&&imp.files[0]; if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var o=JSON.parse(rd.result);
        if(!o||typeof o!=='object'||typeof o.days!=='object')throw new Error('bad file');
        state=norm(o); save(); render(); setStatus('Imported from file');
      }catch(err){setStatus('That file is not a Keystones backup');}
    };
    rd.readAsText(f);
  });
  ['w0','w1','b0','b1'].forEach(function(id){
    var el=document.getElementById(id);
    el.addEventListener('change',function(){
      var v=el.value; if(!/^\d\d:\d\d$/.test(v))return;
      var s=state.settings;
      if(id==='w0')s.wake[0]=v; if(id==='w1')s.wake[1]=v;
      if(id==='b0')s.bed[0]=v; if(id==='b1')s.bed[1]=v;
      s.set=true; save(); render();
    });
  });
  buildSheet();
}

function buildSheet(){
  var wk=weekKeys(sel);
  var head='<tr><th class="lab"></th>'+wk.map(function(k,i){return '<th>'+DNAMES[i]+'<small>'+parse(k).getDate()+'</small></th>'}).join('')+'</tr>';
  var boxes=wk.map(function(){return '<td><i></i></td>'}).join('');
  function r(h,cls,note){
    var w=h.when?' ('+fmtRange(state.settings[h.when])+')':'';
    return '<tr class="'+cls+'"><td class="lab"><b>'+h.t+w+'</b><span>'+h.d+(note||'')+'</span><span>'+h.f+'</span></td>'+boxes+'</tr>';
  }
  function g(t){return '<tr class="grp"><td colspan="8">'+t+'</td></tr>'}
  var html='<h1>Week of '+fmtLong(wk[0],{month:'long',day:'numeric'})+'</h1>'+
    '<p>Wake '+fmtRange(state.settings.wake)+'. In bed '+fmtRange(state.settings.bed)+'.</p>'+
    '<table>'+head+g('Keystones: all three make the day count')+
    KEYS.map(function(x){return r(x,'k')}).join('')+
    '<tr class="win"><td class="lab"><b>Day counts</b><span>All three keystones checked.</span></td>'+boxes+'</tr>'+
    g('Extras')+BONUS.map(function(x){return r(x,'')}).join('')+
    g('Weekly targets')+WEEK.map(function(x){return r(x,'',' Aim for '+x.target+' of 7.')}).join('')+
    '</table><div class="rules">Floor versions count. Never miss twice. Decide what you will watch before you get into bed.</div>';
  sheetEl.innerHTML=html;
}

appEl.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b)return;
  var a=b.dataset.act;
  if(a==='full')toggle(sel,b.dataset.id,1);
  else if(a==='floor')toggle(sel,b.dataset.id,2);
  else if(a==='prev'){sel=addDays(sel,-1);render()}
  else if(a==='next'){if(sel<today){sel=addDays(sel,1);render()}}
  else if(a==='go'){sel=b.dataset.k;render()}
  else if(a==='today'){sel=today;render()}
  else if(a==='print'){buildSheet();try{window.print()}catch(err){}}
  else if(a==='gh-save'){
    var repo=document.getElementById('g-repo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,'');
    var tok=document.getElementById('g-tok').value.trim();
    var path=document.getElementById('g-path').value.trim().replace(/^\/+/,'')||'keystones-data.json';
    var br=document.getElementById('g-br').value.trim();
    if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){setStatus('Enter the repo as username/name');return}
    if(!tok){setStatus('Paste your token first');return}
    gh={repo:repo,token:tok,path:path,branch:br};
    try{localStorage.setItem(GHK,JSON.stringify(gh));}catch(err){}
    ghSha=null; ghInit();
  }
  else if(a==='gh-off'){
    try{localStorage.removeItem(GHK);}catch(err){}
    gh=null; ghSha=null; syncText=''; bkOpen=true; render();
  }
  else if(a==='export'){
    var blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'});
    var u=URL.createObjectURL(blob), an=document.createElement('a');
    an.href=u; an.download='keystones-backup-'+today+'.json';
    document.body.appendChild(an); an.click(); an.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},1000);
  }
});

document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible')return;
  var n=nowKey();
  if(n!==today){if(sel===today)sel=n;today=n;render();}
});

// Optional account sync: only runs inside Claude's artifact viewer. On GitHub Pages
// (or any normal host) window.claude does not exist and the page uses localStorage.
async function initDb(){
  try{
    if(!window.claude||!window.claude.use)return;
    var db=await claude.use('db'), user=await claude.use('user');
    if(!db||!user)return;
    var id=await user.id(); if(!id)return;
    var ref=db.doc('data/users/'+id+'/tracker');
    var snap=await ref.get();
    if(snap.exists){
      var remote=snap.data();
      if(remote&&(+remote.updated||0)>(state.updated||0)){
        state=norm(remote);
        try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
      }else{await ref.set(state)}
    }else{await ref.set(state)}
    docRef=ref; setSync('account'); render();
  }catch(e){docRef=null;setSync('device');}
}

render();
initDb();
ghInit();
})();
</script>
